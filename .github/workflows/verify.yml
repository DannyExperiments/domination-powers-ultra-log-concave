name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Exact log-concavity check (corroborating)
        run: python3 -I verification/src/exact_logconcavity.py
      - name: Intermediate claims (corroborating)
        run: python3 -I verification/src/intermediate_claims.py
      - name: Positive control must find a non-ULC graph
        run: python3 -I verification/src/positive_control.py | grep -q "FAILURE FOUND"
      - name: Checksums
        run: sha256sum -c SHA256SUMS.txt
